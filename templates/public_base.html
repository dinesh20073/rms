{% extends 'base.html' %}

{% block body_content %}
<style>
    /* Modern Clean Form Design System */
    :root {
        --form-bg: #f8f9fa;
        --form-card: #ffffff;
        --form-primary: #1a73e8;
        --form-primary-hover: #1557b0;
        --form-heading: #202124;
        --form-text: #3c4043;
        --form-border: #dadce0;
        --form-focus: #1a73e8;
        --form-required: #d93025;
    }

    .survey-bg-canvas {
        background-color: #f8f9fa;
        background-image: radial-gradient(#e8eaed 1px, transparent 1px);
        background-size: 24px 24px;
        min-height: 100vh;
        position: relative;
    }

    /* Modern Rounded Form Card */
    .survey-card-container {
        position: relative;
        z-index: 10;
        background-color: #ffffff;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
        border-radius: 16px;
        border: 1px solid #dadce0;
        overflow: hidden;
    }

    .survey-header-banner {
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
        color: #ffffff;
        padding: 24px 32px;
    }

    /* Polished Modern Inputs */
    .survey-input {
        width: 100%;
        background-color: #ffffff !important;
        color: #202124 !important;
        border: 1px solid #dadce0 !important;
        border-radius: 8px !important;
        padding: 10px 14px !important;
        font-size: 14px !important;
        outline: none !important;
        transition: all 0.15s ease-in-out !important;
    }
    .survey-input:hover {
        border-color: #bdc1c6 !important;
    }
    .survey-input:focus {
        border-color: #1a73e8 !important;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15) !important;
    }
    .survey-input::placeholder {
        color: #9aa0a6 !important;
    }

    /* Modern Primary Action Button */
    .survey-btn-submit {
        background-color: #1a73e8 !important;
        background-image: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%) !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        padding: 12px 28px !important;
        border-radius: 8px !important;
        border: none !important;
        cursor: pointer;
        transition: all 0.15s ease-in-out !important;
        box-shadow: 0 2px 6px rgba(26, 115, 232, 0.25) !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        text-decoration: none !important;
    }
    .survey-btn-submit:hover {
        background-color: #1557b0 !important;
        background-image: linear-gradient(135deg, #1557b0 0%, #0d47a1 100%) !important;
        box-shadow: 0 4px 12px rgba(26, 115, 232, 0.35) !important;
        transform: translateY(-1px);
    }
    .survey-btn-submit:active {
        transform: translateY(0);
    }
</style>

<div class="survey-bg-canvas flex flex-col justify-start items-center py-6 sm:py-10 px-3 sm:px-6 relative min-h-screen">
    
    <!-- Top Brand Logo -->
    <div class="mb-5 flex items-center gap-2 select-none">
        <span class="font-display font-bold text-base text-[#202124] tracking-tight">Nizhal Community</span>
    </div>

    <!-- Main Content Container -->
    <main class="relative z-10 w-full max-w-2xl">
        {% block main_content %}{% endblock %}
    </main>

    <!-- Footer note -->
    <div class="mt-8 text-center text-xs text-[#5f6368] select-none">
        <span>Powered by Nizhal Registration Management System</span>
    </div>

</div>
{% endblock %}
