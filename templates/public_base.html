{% extends 'base.html' %}
{% load static %}

{% block body_content %}
<style>
    /* Ultra-Modern Design System for Registration & Checkout */
    :root {
        --form-bg: #f8fafc;
        --form-card: #ffffff;
        --form-primary: #2563eb;
        --form-primary-hover: #1d4ed8;
        --form-heading: #0f172a;
        --form-text: #334155;
        --form-muted: #64748b;
        --form-border: #e2e8f0;
        --form-border-focus: #3b82f6;
    }

    .public-canvas {
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px);
        background-size: 20px 20px;
        min-height: 100vh;
    }

    .public-card {
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
        overflow: hidden;
        transition: box-shadow 0.2s ease;
    }

    .public-input-group {
        position: relative;
        display: flex;
        align-items: center;
    }

    .public-input-icon {
        position: absolute;
        left: 14px;
        color: #94a3b8;
        pointer-events: none;
        transition: color 0.15s ease;
    }

    .public-input {
        width: 100%;
        background-color: #ffffff !important;
        color: #0f172a !important;
        border: 1.5px solid #e2e8f0 !important;
        border-radius: 10px !important;
        padding: 11px 14px !important;
        font-size: 14px !important;
        line-height: 1.4 !important;
        outline: none !important;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .public-input.with-icon {
        padding-left: 42px !important;
    }

    .public-input:hover {
        border-color: #cbd5e1 !important;
    }

    .public-input:focus {
        border-color: #2563eb !important;
        box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.12) !important;
    }

    .public-input-group:focus-within .public-input-icon {
        color: #2563eb !important;
    }

    .public-input::placeholder {
        color: #94a3b8 !important;
    }

    .public-btn-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        padding: 13px 24px !important;
        border-radius: 10px !important;
        border: none !important;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 14px -1px rgba(37, 99, 235, 0.35) !important;
        transition: all 0.15s ease !important;
        text-decoration: none !important;
    }

    .public-btn-primary:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%) !important;
        box-shadow: 0 6px 20px -2px rgba(37, 99, 235, 0.45) !important;
        transform: translateY(-1px);
    }

    .public-btn-primary:active {
        transform: translateY(0);
    }

    .chip-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
    }
</style>

<div class="public-canvas flex flex-col justify-start items-center py-6 sm:py-10 px-3 sm:px-6 relative min-h-screen">
    
    <!-- Top Brand Header -->
    <header class="mb-5 flex items-center gap-2.5 select-none">
        <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
            N
        </div>
        <span class="font-display font-bold text-base text-slate-800 tracking-tight">Nizhal Events</span>
    </header>

    <!-- Main Content Container -->
    <main class="relative z-10 w-full max-w-2xl">
        {% block main_content %}{% endblock %}
    </main>

    <!-- Footer note -->
    <footer class="mt-8 text-center text-xs text-slate-400 select-none pb-6">
        <span>Powered by Nizhal Registration Platform • Secure &amp; Verified</span>
    </footer>

</div>
{% endblock %}
