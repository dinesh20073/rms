<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Innovators Summit 2026 - Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/ai_register.css" />
    <script src="/static/js/ai_register.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>AI Innovators Summit 2026</h1>
      <p class="subtitle">Deep dive into Generative AI, Large Language Models, and Agentic Workflows.</p>
      <p class="location">Bengaluru International Exhibition Centre (BIEC) &amp; Online</p>
      <p class="datetime">28-Aug-2026 • 09:30 AM IST</p>
      <p class="fee">Fee: <strong>₹500 INR / person</strong></p>
    </header>
    <section class="form-section">
      <form method="POST" action="/register/ai-innovators-2026/submit/" id="registrationForm" class="form-card" novalidate>
        {% csrf_token %}
        <h2 class="form-title">Required</h2>
        <div class="field-group">
          <label for="full_name">Full Name *</label>
          <input type="text" id="full_name" name="full_name" class="input-field" placeholder="Enter your full name" required />
        </div>
        <div class="field-group">
          <label for="email_address">Email Address *</label>
          <input type="email" id="email_address" name="email_address" class="input-field" placeholder="Enter your email address" required />
        </div>
        <div class="field-group">
          <label for="phone_number">Phone Number *</label>
          <input type="tel" id="phone_number" name="phone_number" class="input-field" placeholder="Enter your phone number" required />
        </div>
        <div class="field-group">
          <label for="age">Age *</label>
          <input type="number" id="age" name="age" class="input-field" placeholder="Enter your age" min="1" required />
        </div>
        <div class="field-group">
          <label for="gender">Gender *</label>
          <select id="gender" name="gender" class="input-field" required>
            <option value="" disabled selected>Select an option...</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field-group">
          <label for="ticket_count">Ticket Count *</label>
          <input type="number" id="ticket_count" name="ticket_count" class="input-field" value="1" min="1" required />
        </div>
        <button type="submit" class="btn-primary">Submit &amp; Continue to Payment (₹500)</button>
      </form>
    </section>
  </div>
</body>
</html>
